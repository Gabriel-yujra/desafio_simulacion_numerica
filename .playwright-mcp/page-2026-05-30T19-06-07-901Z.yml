          - generic [ref=e27]: Trabajo final · Métodos Numéricos
          - heading "Simulación numérica de abastecimiento, precios y conflicto social" [level=1] [ref=e28]
          - paragraph [ref=e29]: "Herramienta académica interactiva para modelar escenarios de crisis mediante métodos numéricos clásicos: sistemas lineales, raíces de ecuaciones, interpolación, integración y ecuaciones diferenciales ordinarias."
        - generic [ref=e32]:
          - heading "⚠ Aviso académico" [level=6] [ref=e33]
          - paragraph [ref=e34]: Esta herramienta tiene fines exclusivamente educativos. Los datos, modelos y resultados son ficticios o simplificados. No representan situaciones reales, ni posiciones políticas de ningún tipo.
      - separator [ref=e35]
      - generic [ref=e37]:
        - heading "Contexto del problema" [level=4] [ref=e38]
        - paragraph [ref=e39]: Las crisis de abastecimiento, la volatilidad en los precios de productos básicos y la erosión del poder adquisitivo constituyen fenómenos complejos que pueden modelarse mediante herramientas matemáticas. Cuando los canales de distribución se ven comprometidos, los precios de alimentos y carburantes experimentan variaciones no lineales que afectan de forma diferenciada a distintos sectores de la población. A su vez, la percepción colectiva de la escasez puede retroalimentar el desabastecimiento a través de dinámicas de acaparamiento o descontento social.
        - paragraph [ref=e40]: "Este proyecto utiliza cinco familias de métodos numéricos para simular, de manera aproximada, distintos aspectos de estas dinámicas: la distribución de recursos en una red de transporte, la detección de umbrales críticos de precios, la reconstrucción de curvas de costo a partir de datos dispersos, el cálculo del costo acumulado y la evolución temporal del descontento social."
      - generic [ref=e41]:
        - generic [ref=e43]:
          - generic [ref=e44]: Objetivo general
          - paragraph [ref=e46]: Aplicar métodos numéricos computacionales para construir simulaciones interactivas que permitan analizar escenarios de abastecimiento, variación de precios y dinámica social, evaluando la precisión, convergencia y utilidad práctica de cada método.
        - generic [ref=e48]:
          - generic [ref=e49]: Objetivos específicos
          - list [ref=e51]:
            - listitem [ref=e52]: Resolver sistemas de ecuaciones lineales para modelar flujos en redes de transporte.
            - listitem [ref=e53]: Encontrar raíces de ecuaciones para identificar umbrales y puntos de equilibrio.
            - listitem [ref=e54]: Aplicar interpolación para reconstruir curvas de precios a partir de datos históricos.
            - listitem [ref=e55]: Calcular integrales numéricas para estimar costos acumulados y pérdida de poder adquisitivo.
            - listitem [ref=e56]: Resolver EDOs para simular el vaciado de reservas y la difusión del descontento social.
