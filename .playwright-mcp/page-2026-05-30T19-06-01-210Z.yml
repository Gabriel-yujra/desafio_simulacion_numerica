enu'); if (!navCollapse) return; navLinks.forEach(link => { link.addEventListener('click', () => { // Bootstrap expone Collapse a travÃ©s de la instancia adjunta al elemento const bsCollapse = bootstrap.Collapse.getInstance(navCollapse); if (bsCollapse) bsCollapse.hide(); }); }); })(); /* â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90 3. UTILIDADES GLOBALES Disponibles en todos los mÃ³dulos vÃa SimNum.* â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90â•\x90 */ const SimNum = (function () { /** * Muestra un mensaje de estado dentro de un contenedor. * @param {string} containerId ID del elemento DOM destino * @param {string} mensaje Texto del mensaje * @param {'success'|'error'|'info'} tipo Clase visual */ function mostrarMensaje(containerId, mensaje, tipo = 'info') { const el = document.getElementById(containerId); if (!el) return; el.innerHTML = `<div class=\"alert-resultado ${tipo}\">${mensaje}</div>`; } /** * Limpia el contenido de un contenedor DOM. * @param {string} containerId */ function limpiarContenedor(containerId) { const el = document.getElementById(containerId); if (el) el.innerHTML = '<p class=\"text-muted small\">Los resultados se mostrarÃ¡n aquÃ.</p>'; } /** * Genera el HTML de una tabla a partir de encabezados y filas. * @param {string[]} headers Array de textos de encabezado * @param {Array[]} rows Array de arrays con valores por fila * @param {number} [maxRows=50] LÃmite de filas renderizadas * @returns {string} HTML de la tabla */ function generarTablaHTML(headers, rows, maxRows = 50) { const ths = headers.map(h => `<th>${h}</th>`).join(''); const filas = rows.slice(0, maxRows).map(row => { const tds = row.map(v => `<td>${typeof v === 'number' ? redondear(v, 8) : v}</td>`).join(''); return `<tr>${tds}</tr>`; }).join(''); const nota = rows.length > maxRows ? `<tr><td colspan=\"${headers.length}\" class=\"text-muted text-center small\"> â€¦ mostrando ${maxRows} de ${rows.length} filas </td></tr>` : ''; return ` <div class=\"table-responsive\"> <table class=\"table table-sm table-bordered table-hover mb-0\"> <thead class=\"table-primary\"><tr>${ths}</tr></thead> <tbody>${filas}${nota}</tbody> </table> </div>`; } /** * EvalÃºa una funciÃ³n f(x) ingresada como string por el usuario. * Usa Function() con contexto restringido para evitar acceso global. * @param {string} expr ExpresiÃ³n JS, ej: \"Math.pow(x,2) - 4\" * @param {number} x * @returns {number} */ function evaluarFuncion(expr, x) { // eslint-disable-next-line no-new-func return new Function('x', `'use strict'; return (${expr});`)(x); } /** * EvalÃºa una funciÃ³n f(t, y) para EDOs. * @param {string} expr * @param {number} t * @param {number} y * @returns {number} */ function evaluarFuncionDos(expr, t, y) { // eslint-disable-next-line no-new-func return new Function('t', 'y', `'use strict'; return (${expr});`)(t, y); } /** * Redondea un nÃºmero a n decimales (evita 1e-16 en pantalla). * @param {number} val * @param {number} [decimales=6] * @returns {number} */ function redondear(val, decimales = 6) { return parseFloat(val.toFixed(decimales)); } /** * Destruye un grÃ¡fico Chart.js previo si existe, para redibujar. * @param {string} canvasId * @returns {CanvasRenderingContext2D|null} */ function prepararCanvas(canvasId) { const canvas = document.getElementById(canvasId); if (!canvas) return null; // Destruir instancia Chart.js previa si existe const prev = Chart.getChart(canvas); if (prev) prev.destroy(); return canvas; } // API pÃºblica return { mostrarMensaje, limpiarContenedor, generarTablaHTML, evaluarFuncion, e