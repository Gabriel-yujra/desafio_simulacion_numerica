        - generic [ref=e26]: "05"
        - generic [ref=e27]:
          - heading "Ecuaciones Diferenciales Ordinarias (EDO)" [level=2] [ref=e28]
          - paragraph [ref=e29]: Vaciado de reservas y difusión del descontento social
      - paragraph [ref=e30]: Las ecuaciones diferenciales ordinarias modelan la evolución temporal de sistemas físicos y sociales. Sigue los pasos numerados abajo para explorar y simular cómo varían las reservas críticas de carburantes y cómo se difunde el descontento social.
      - generic [ref=e31]:
        - generic [ref=e32]:
          - generic [ref=e33]: "1"
          - generic [ref=e34]:
            - 'heading "① El Problema: Dinámicas Temporales y Acoplamiento" [level=3] [ref=e35]':
              - generic [ref=e36]: ①
              - text: "El Problema: Dinámicas Temporales y Acoplamiento"
            - paragraph [ref=e37]: "Analizamos cómo evolucionan dos problemas complejos en el tiempo mediante ecuaciones diferenciales continuas:"
            - generic [ref=e38]:
              - generic [ref=e40]:
                - 'heading "Escenario B: Vaciado de Reservas de Combustible" [level=5] [ref=e41]': "Escenario B: Vaciado de Reservas de Combustible"
                - paragraph [ref=e42]: La planta de Senkata almacena combustible para abastecer la ciudad. Debido a bloqueos y retrasos en el suministro, el ingreso diario (6.000 L/día) es menor que el consumo normal (10.000 L/día). Predecimos cuántos días tardará en alcanzarse el nivel crítico de reserva (20.000 L) antes de un desabastecimiento generalizado.
              - generic [ref=e44]:
                - 'heading "Escenario G: Difusión del Descontento Social (N-M-D)" [level=5] [ref=e45]': "Escenario G: Difusión del Descontento Social (N-M-D)"
                - paragraph [ref=e46]: "Durante una crisis prolongada, el malestar social se propaga en la población. Dividimos a la ciudadanía en tres grupos interactivos: ciudadanos Neutrales ($N$), Manifestantes activos ($M$) y mediadores de diálogo ($D$). Simulamos si las protestas colapsan o se masifican según la intervención del diálogo."
        - generic [ref=e47]:
          - generic [ref=e48]: "2"
          - generic [ref=e49]:
            - heading "② Datos y Parámetros Iniciales de Simulación" [level=3] [ref=e50]:
              - generic [ref=e51]: ②
              - text: Datos y Parámetros Iniciales de Simulación
            - paragraph [ref=e52]: "Los coeficientes y valores de stock que alimentan nuestros algoritmos en el día cero ($t=0$):"
            - generic [ref=e53]:
              - generic [ref=e55]:
                - heading "Datos - Vaciado de Tanques (Escenario B)" [level=5] [ref=e56]
                - list [ref=e57]:
                  - listitem [ref=e58]:
                    - strong [ref=e59]: "Reserva Inicial ($R_0$):"
                    - text: 100.000 litros.
                  - listitem [ref=e60]:
                    - strong [ref=e61]: "Umbral Crítico:"
                    - text: 20.000 litros.
                  - listitem [ref=e62]:
                    - strong [ref=e63]: "Abastecimiento de Entrada:"
                    - text: 6.000 L/día (normal) o 3.000 L/día (en bloqueos severos).
                  - listitem [ref=e64]:
                    - strong [ref=e65]: "Consumo de Salida:"
                    - text: 10.000 L/día (normal) o 14.000 L/día (compras de pánico).
              - generic [ref=e67]:
                - heading "Datos - Difusión Social (Escenario G)" [level=5] [ref=e68]
                - list [ref=e69]:
                  - listitem [ref=e70]:
                    - strong [ref=e71]: "Población Inicial:"
                    - text: Neutrales $N_0 = 900$, Manifestantes $M_0 = 80$, Mediadores $D_0 = 20$.
                  - listitem [ref=e72]:
                    - strong [ref=e73]: "Parámetros logísticos predeterminados:"
                    - text: Tasa de contagio social ($a = 0.0005$), retorno a neutralidad ($b = 0.05$), efectividad del diálogo ($c = 0.0004$), reclutamiento de mediadores ($k = 0.10$), fatiga ($r = 0.05$).
        - generic [ref=e74]:
          - generic [ref=e75]: "3"
          - generic [ref=e76]:
            - heading "③ El Modelo Matemático y los Algoritmos EDO" [level=3] [ref=e77]:
              - generic [ref=e78]: ③
              - text: El Modelo Matemático y los Algoritmos EDO
            - paragraph [ref=e79]: "La dinámica temporal se modela mediante ecuaciones diferenciales de primer orden simples o acopladas:"
            - generic [ref=e80]:
              - generic [ref=e82]:
                - heading "EDO Vaciado de Reservas (1D)" [level=5] [ref=e83]
                - paragraph [ref=e84]: "El volumen del tanque cambia según el diferencial de entrada y salida: $$\\frac{dR}{dt} = \\text{Entrada} - \\text{Salida}$$"
                - paragraph [ref=e85]: Evaluamos el comportamiento lineal con tasas constantes o modelos no lineales simulando fugas o vaciados acelerados.
              - generic [ref=e87]:
                - heading "Sistema Acoplado N-M-D (3D)" [level=5] [ref=e88]
                - paragraph [ref=e89]: "La interacción social se modela de forma análoga a la epidemiología SIR: $$\\frac{dN}{dt} = -aNM + bD$$ $$\\frac{dM}{dt} = aNM - cMD$$ $$\\frac{dD}{dt} = kM - rD$$"
                - paragraph [ref=e90]: "Tres solucionadores son comparados: **Euler** (O(h)), **Heun** (O(h²)) y **Runge-Kutta 4** (O(h⁴)), recomendándose este último por su alta precisión en sistemas acoplados."
