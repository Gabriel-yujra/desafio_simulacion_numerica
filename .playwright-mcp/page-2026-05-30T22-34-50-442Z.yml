          - paragraph [ref=e29]: Abastecimiento y red de transporte
      - paragraph [ref=e30]: Una red de distribución de bienes puede representarse como un sistema de ecuaciones lineales $Ax = b$, donde cada ecuación expresa el balance de flujo en un nodo. Guiado por los siguientes pasos, comprenderás y simularás el comportamiento de dos situaciones críticas del país.
