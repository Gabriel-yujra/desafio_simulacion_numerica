                - paragraph [ref=e42]: La Asociación Nacional de Distribución de Combustibles debe abastecer tres zonas clave de una ciudad (Norte, Centro, Sur) desde tres plantas de almacenamiento (El Alto, Viacha, Senkata). Con bloqueos y alta demanda, se busca calcular los flujos óptimos para evitar desabastecimiento.
              - generic [ref=e44]:
