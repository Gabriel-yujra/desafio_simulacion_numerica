              - text: "El Modelo Matemático: Área Bajo la Curva"
            - paragraph [ref=e86]: "El gasto acumulado total corresponde a la suma continua de los costos diarios, modelado como la integral definida: $$\\text{Gasto Acumulado} = \\int_{a}^{b} C(t) \\, dt$$ Como no conocemos la función analítica exacta y dependemos de datos muestreados, aplicamos tres aproximaciones numéricas clásicas:"
            - generic [ref=e87]:
              - generic [ref=e89]:
                - heading "Regla del Trapecio" [level=5] [ref=e90]
                - paragraph [ref=e91]: Aproxima el área bajo la curva uniendo los puntos mediante segmentos rectilíneos. Es muy sencillo pero menos exacto ante curvas pronunciadas.
              - generic [ref=e93]:
                - heading "Regla de Simpson 1/3" [level=5] [ref=e94]
                - paragraph [ref=e95]: Aproxima el área ajustando parábolas de segundo grado para grupos de tres puntos consecutivos. Requiere que el número de subintervalos $n$ sea par.
              - generic [ref=e97]:
                - heading "Regla de Simpson 3/8" [level=5] [ref=e98]
                - paragraph [ref=e99]: Utiliza polinomios de tercer grado para ajustar grupos de cuatro puntos. Requiere que el número de subintervalos $n$ sea múltiplo de 3.
