              - text: "El Problema: El Impacto de la Inflación Acumulada"
            - paragraph [ref=e37]: Una familia realiza diariamente compras de una canasta básica (papa, arroz, aceite, azúcar). Debido al desabastecimiento provocado por bloqueos e incremento de costos de transporte, los precios suben día a día de forma acumulativa. El problema consiste en determinar cuánto dinero extra gasta realmente esta familia al final de un período mensual debido a la inflación, comparándolo con lo que habrían gastado si los precios permanecieran estables.
