        - generic [ref=e171]:
          - heading "Raíces de ecuaciones" [level=2] [ref=e172]
          - paragraph [ref=e173]: Umbrales críticos y puntos de equilibrio
      - paragraph [ref=e174]:
        - text: "En un mercado sometido a escasez, existen umbrales de precio a partir de los cuales la demanda colapsa o surgen mercados informales. Encontrar estos puntos equivale a hallar la raíz de una función que expresa el exceso de demanda sobre la oferta disponible. Se implementan tres métodos:"
        - strong [ref=e175]: Bisección
        - text: (garantiza convergencia si f(a)·f(b) < 0),
        - strong [ref=e176]: Newton-Raphson
        - text: (convergencia cuadrática, requiere derivada) y
        - strong [ref=e177]: Secante
        - text: (orden ~1.618, sin derivada analítica).
      - generic [ref=e178]:
        - strong [ref=e179]: ¿Qué se modela?
        - text: El mes o precio exacto en que el gasto familiar iguala al ingreso disponible, o el punto de equilibrio entre la tasa de demanda y la tasa de reposición del proveedor.
        - strong [ref=e180]: ¿Qué responde la simulación?
        - text: "Si Newton-Raphson converge en 4–6 iteraciones, hay una raíz bien definida: existe un umbral crítico claro. Si necesita muchas iteraciones o no converge, la función es muy plana en esa zona — el mercado no tiene un punto de quiebre abrupto sino una transición gradual."
