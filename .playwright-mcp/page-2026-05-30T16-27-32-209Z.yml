        - generic [ref=e229]:
          - heading "Interpolación" [level=2] [ref=e230]
          - paragraph [ref=e231]: Reconstrucción de curvas de precios
      - paragraph [ref=e232]:
        - text: "En el Escenario C, se dispone de registros históricos dispersos del precio de un producto básico (día vs. precio en Bs). La interpolación construye una función continua que pasa exactamente por todos los puntos conocidos, permitiendo estimar el precio en días sin dato. Se implementan tres métodos:"
        - strong [ref=e233]: Lagrange
        - text: "y"
        - strong [ref=e234]: diferencias divididas de Newton
        - text: (ambos construyen un único polinomio de grado n−1) y el
        - strong [ref=e235]: Spline cúbico natural
        - text: (piezas cúbicas con continuidad C², que evita las oscilaciones del fenómeno de Runge en series largas).
      - generic [ref=e236]:
        - strong [ref=e237]: ¿Qué se modela?
        - text: La evolución del precio de la canasta básica durante una crisis, reconstruida a partir de registros puntuales (ej. mediciones cada semana).
        - strong [ref=e238]: ¿Qué responde la simulación?
        - text: ¿Cuál es el precio estimado en un día sin registro? Si la curva del Spline es suave y los tres métodos coinciden, el modelo es confiable. Si Lagrange oscila fuertemente al alejarse de los datos, se está observando el fenómeno de Runge — señal de que el Spline es la opción más adecuada.
