          - paragraph [ref=e325]: Costo acumulado y pérdida de poder adquisitivo
      - paragraph [ref=e326]:
        - text: El costo acumulado de una canasta básica se representa como el área bajo la curva de precios en el tiempo — una integral que rara vez tiene solución analítica cuando los datos provienen de modelos reales. Se implementan las reglas del
        - strong [ref=e327]: Trapecio
        - text: ","
        - strong [ref=e328]: Simpson 1/3
        - text: "y"
        - strong [ref=e329]: Simpson 3/8
        - text: . El
        - strong [ref=e330]: Escenario D
        - text: "compara dos situaciones: precios crecientes por inflación exponencial versus precios constantes, cuantificando la"
        - emphasis [ref=e331]: pérdida de poder adquisitivo familiar acumulada
        - text: en bolivianos.
      - generic [ref=e332]:
        - strong [ref=e333]: ¿Qué se modela?
        - text: El gasto total acumulado de una familia durante 12 meses cuando el precio de la canasta básica crece a una tasa de inflación del 5% mensual.
        - strong [ref=e334]: ¿Qué responde la simulación?
        - text: Simpson 1/3 produce el resultado más preciso con el mismo número de evaluaciones que el Trapecio. La diferencia entre los tres métodos es el error numérico — si coinciden hasta 4 cifras significativas, la integral está bien aproximada. El botón "Comparar sin inflación" cuantifica cuántos bolivianos adicionales paga una familia por efecto de la inflación.
