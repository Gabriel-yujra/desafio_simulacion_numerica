        - text: (M) y
        - emphasis [ref=e416]: detenidos
        - text: "(D), cuya dinámica emerge de la interacción entre los tres grupos. Se comparan tres métodos de integración numérica en el tiempo:"
        - strong [ref=e417]: Euler
        - text: (O(h)),
        - strong [ref=e418]: Heun / predictor-corrector
        - text: (O(h²)) y
        - strong [ref=e419]: Runge-Kutta 4° orden
        - text: (O(h⁴)).
      - generic [ref=e420]:
        - strong [ref=e421]: ¿Qué se modela?
        - text: "En el escenario de reservas: el vaciado acelerado de combustible cuando la tasa de consumo crece linealmente (crisis prolongada). En el escenario social: cómo una pequeña chispa de protesta (M₀ = 10) puede transformarse en una ola masiva de manifestaciones y luego decaer."
        - strong [ref=e422]: ¿Qué responde la simulación?
        - text: Euler, Heun y RK4 deben producir trayectorias similares; las diferencias revelan el error de discretización. Si Euler se desvía visiblemente de RK4, significa que el paso h es demasiado grande. El segundo gráfico del escenario social compara M(t) entre los tres métodos, mostrando cuándo el paso h es suficientemente fino.
