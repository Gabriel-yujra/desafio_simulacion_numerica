        - generic [ref=e632]: "06"
        - generic [ref=e633]:
          - heading "Conclusiones" [level=2] [ref=e634]
          - paragraph [ref=e635]: Síntesis y reflexión académica
      - generic [ref=e636]:
        - generic [ref=e639]:
          - heading "Aprendizajes obtenidos" [level=5] [ref=e640]
          - paragraph [ref=e641]: "La implementación computacional de los cinco módulos demostró que los métodos numéricos permiten aproximar fenómenos socioeconómicos complejos con modelos matemáticos relativamente sencillos. La clave no es solo obtener un número, sino interpretar su significado en contexto: una raíz es un umbral crítico, un área es un costo acumulado, una trayectoria EDO es la evolución temporal de un sistema."
          - paragraph [ref=e642]: "Al comparar Euler, Heun y RK4 sobre el mismo modelo de reservas, se evidenció empíricamente la diferencia de orden entre los métodos: con h = 0.5, los tres producen trayectorias casi indistinguibles, pero con h = 5, Euler acumula errores visibles que RK4 evita. Este tipo de comparación es imposible de apreciar solo con la teoría."
        - generic [ref=e645]:
          - heading "Métodos más útiles por escenario" [level=5] [ref=e646]
          - list [ref=e647]:
            - listitem [ref=e648]:
              - strong [ref=e649]: "Redes de transporte:"
              - text: Gauss-Seidel (convergencia más rápida que Jacobi en sistemas bien condicionados).
            - listitem [ref=e650]:
              - strong [ref=e651]: "Umbrales de precio:"
              - text: Newton-Raphson (convergencia cuadrática).
            - listitem [ref=e652]:
              - strong [ref=e653]: "Curvas de precio:"
              - text: Interpolación de Newton (más estable numéricamente para muchos puntos).
            - listitem [ref=e654]:
              - strong [ref=e655]: "Costo acumulado:"
              - text: Simpson 1/3 (mayor orden de exactitud con igual número de evaluaciones).
            - listitem [ref=e656]:
              - strong [ref=e657]: "Dinámicas temporales:"
              - text: RK4 (equilibrio óptimo entre precisión y simplicidad de implementación).
        - generic [ref=e660]:
          - heading "Limitaciones del modelo" [level=5] [ref=e661]
          - list [ref=e662]:
            - listitem [ref=e663]: Los modelos asumen comportamientos ideales (linealidad, continuidad) que raramente se cumplen en sistemas económicos reales.
            - listitem [ref=e664]: Los datos utilizados son sintéticos o ilustrativos; una aplicación real requeriría series estadísticas oficiales validadas.
            - listitem [ref=e665]: El modelo N–M–D de conflicto social no captura heterogeneidad poblacional, efectos geográficos ni políticas de respuesta dinámica.
            - listitem [ref=e666]: La interpolación asume que el comportamiento entre dos mediciones es suave; en mercados volátiles puede haber saltos bruscos que ningún polinomio reproduce bien.
            - listitem [ref=e667]: Los métodos iterativos de álgebra lineal son sensibles al condicionamiento de la matriz; sistemas mal condicionados (como el de Hilbert) convergen muy lentamente o divergen.
        - generic [ref=e670]:
          - heading "Ideas de mejoras futuras" [level=5] [ref=e671]
          - list [ref=e672]:
            - listitem [ref=e673]: Integrar datos reales de organismos estadísticos (INE, Banco Central) para validar los modelos contra series históricas.
            - listitem [ref=e674]: "Ampliar el modelo de EDOs con ecuaciones acopladas entre reservas y precios: cuando las reservas caen, el precio sube, lo que retroalimenta el descontento."
            - listitem [ref=e675]: "Incorporar análisis de sensibilidad automático: variar parámetros (tasa de inflación, capacidad de red) y graficar cómo cambian los resultados."
            - listitem [ref=e676]: Añadir exportación de resultados en CSV o PDF para facilitar el análisis externo y la presentación al tribunal.
            - listitem [ref=e677]: Implementar cuadratura adaptativa (Gauss-Legendre) para integrales con discontinuidades o picos agudos.
