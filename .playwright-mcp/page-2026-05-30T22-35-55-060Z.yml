              - text: "El Problema: Datos Dispersos en Tiempos de Crisis"
            - paragraph [ref=e37]: Durante las crisis de abastecimiento, los precios de los productos básicos fluctúan a diario. Los mercados oficiales solo reportan precios algunos días específicos del mes, dejando vacíos de información. El objetivo es modelar la trayectoria continua de los precios (especialmente de la papa en Bs/kg) para entender el comportamiento de la canasta alimenticia.
