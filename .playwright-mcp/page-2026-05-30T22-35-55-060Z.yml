              - text: Comparación de Modelos de Interpolación
            - paragraph [ref=e82]: "Podemos abordar la reconstrucción de la curva de precios mediante diferentes aproximaciones polinómicas:"
            - generic [ref=e83]:
              - generic [ref=e85]:
                - heading "Lagrange" [level=5] [ref=e86]
                - paragraph [ref=e87]: Construye un polinomio global de grado $n-1$. Es matemáticamente exacto para los puntos dados, pero tiende a oscilar salvajemente en los extremos al agregar muchos puntos (Fenómeno de Runge).
              - generic [ref=e89]:
                - heading "Diferencias Divididas (Newton)" [level=5] [ref=e90]
                - paragraph [ref=e91]: Genera el mismo polinomio que Lagrange, pero mediante un algoritmo iterativo que facilita añadir nuevos datos sin recalcular todo el sistema desde cero.
              - generic [ref=e93]:
                - heading "Splines Cúbicos Naturales" [level=5] [ref=e94]
                - paragraph [ref=e95]: Construye tramos de curvas cúbicas independientes entre cada par de puntos vecinos, exigiendo continuidad de la primera y segunda derivada ($C^2$). Ofrece el trazado más natural y realista de precios.
