          - paragraph [ref=e29]: Reconstrucción de curvas de precios
      - paragraph [ref=e30]: La interpolación matemática permite estimar valores intermedios a partir de observaciones históricas discretas. Sigue este flujo paso a paso para reconstruir la curva continua de inflación alimentaria.
      - generic [ref=e31]:
