          - paragraph [ref=e29]: Abastecimiento y red de transporte
      - paragraph [ref=e30]:
        - text: "Una red de distribución de bienes puede representarse como un sistema Ax = b donde cada ecuación expresa la restricción de flujo en un nodo. Se implementan cinco métodos:"
        - strong [ref=e31]: LU
        - text: (directo),
        - strong [ref=e32]: Jacobi
        - text: ","
        - strong [ref=e33]: Gauss-Seidel
        - text: ","
        - strong [ref=e34]: SOR
        - text: "y"
        - strong [ref=e35]: Gradiente Conjugado
        - text: . Los métodos iterativos garantizan convergencia si la matriz es diagonalmente dominante.
      - generic [ref=e36]:
        - strong [ref=e37]: ¿Qué se modela?
        - text: La distribución de combustible y alimentos entre una planta central, depósitos intermedios y zonas de consumo, donde cada flujo debe satisfacer restricciones de balance.
        - strong [ref=e38]: ¿Qué responde la simulación?
        - text: ¿Cuántas unidades debe enviar cada nodo para satisfacer la demanda? Si la matriz converge rápidamente con Gauss-Seidel (pocas iteraciones, residuo bajo), el sistema de distribución está bien condicionado. Si no converge, indica desbalances en la red que requieren rediseño.
